name: Refresh Profile Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Render profile analytics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ninjaarara
          cards: overview,momentum,contributions,lifetime,composition,rhythm,cadence,repositories,portfolio,languages
          output-dir: assets/profile-cards
          themes: dark
          palette: purple
          commit: true
          commit-message: "chore(profile): refresh analytics cards [skip ci]"
