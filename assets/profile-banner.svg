<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Sura Ryzen — Animated Digital Workshop</title>
<desc id="desc">Animated dark developer banner with orbiting cyan and violet elements.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset=".55" stop-color="#121a30"/><stop offset="1" stop-color="#24143d"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#b7c8e5" stroke-opacity=".08"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="380" rx="24" fill="url(#bg)"/>
<rect width="1200" height="380" rx="24" fill="url(#grid)"/>
<circle cx="990" cy="175" r="125" fill="#8b5cf6" opacity=".15" filter="url(#blur)"/>
<g transform="translate(990 175)">
 <circle r="110" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="22 12" opacity=".75">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
 </circle>
 <circle r="82" fill="none" stroke="#5eead4" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="3 9">
  <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
 </circle>
 <circle r="55" fill="#0d1727" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5"/>
 <path d="M-18 -15L0 -30L18 -15V15L0 30L-18 15Z" fill="none" stroke="url(#neon)" stroke-width="3"/>
 <circle r="8" fill="#5eead4"><animate attributeName="r" values="6;11;6" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="0" cy="-110" r="6" fill="#5eead4"/>
 <circle cx="110" cy="0" r="5" fill="#a78bfa"/>
</g>
<g fill="#5eead4">
 <circle cx="810" cy="70" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="1120" cy="285" r="4"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="300" r="2.5"><animate attributeName="opacity" values=".1;.9;.1" dur="1.7s" repeatCount="indefinite"/></circle>
</g>
<rect x="72" y="62" width="5" height="250" rx="3" fill="url(#neon)"/>
<text x="105" y="105" fill="#5eead4" font-family="monospace" font-size="15" letter-spacing="4">INDEPENDENT DEVELOPER / ID</text>
<text x="100" y="192" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="700" letter-spacing="-3">SURA RYZEN</text>
<text x="104" y="238" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="21">Code with purpose. Design with curiosity.</text>
<text x="104" y="296" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="2">WEB DEVELOPMENT  ·  CREATIVE TECH  ·  OPEN SOURCE</text>
<rect x="104" y="326" width="250" height="3" rx="2" fill="#334155"/>
<rect x="104" y="326" width="75" height="3" rx="2" fill="url(#neon)"><animate attributeName="x" values="104;279;104" dur="4s" repeatCount="indefinite"/></rect>
<text x="1128" y="340" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">SR / 002 — ALWAYS IN MOTION</text>
</svg>