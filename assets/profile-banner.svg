<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Sura Ryzen — Digital Workshop</title>
<desc id="desc">A custom dark editorial banner with cyan and violet geometric accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d18"/><stop offset=".58" stop-color="#11182b"/><stop offset="1" stop-color="#21143b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9fb4d0" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<circle cx="1010" cy="155" r="128" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>
<circle cx="1010" cy="155" r="100" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".65"/>
<circle cx="1010" cy="155" r="72" fill="none" stroke="#5eead4" stroke-opacity=".45" stroke-dasharray="4 10"/>
<path d="M910 155h200M1010 55v200" stroke="#c4b5fd" stroke-opacity=".25"/>
<path d="M950 95l120 120M1070 95L950 215" stroke="#5eead4" stroke-opacity=".18"/>
<circle cx="1010" cy="155" r="9" fill="#5eead4"/>
<rect x="72" y="62" width="6" height="236" rx="3" fill="url(#accent)"/>
<text x="105" y="104" fill="#5eead4" font-family="monospace" font-size="15" letter-spacing="4">INDEPENDENT DEVELOPER / ID</text>
<text x="100" y="190" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700" letter-spacing="-2">SURA RYZEN</text>
<text x="104" y="232" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="21">Code with purpose. Design with curiosity.</text>
<text x="104" y="292" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="2">WEB DEVELOPMENT  ·  CREATIVE TECH  ·  OPEN SOURCE</text>
<text x="1128" y="324" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">SR / 001</text>
</svg>